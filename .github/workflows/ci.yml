name: CI - DevOps Portfolio Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: Code Quality, Syntax & Asset Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Validation Tools
        run: |
          npm install --no-save htmlhint stylelint stylelint-config-standard

      - name: Validate HTML Syntax & Accessibility
        run: |
          npx htmlhint "index.html" --rules "tag-pair=true,attr-no-duplication=true,doctype-first=true,spec-char-escape=false"

      - name: Validate CSS Syntax
        run: |
          npx stylelint "assets/css/*.css" --config '{"extends": "stylelint-config-standard", "rules": {"no-descending-specificity": null, "property-no-vendor-prefix": null}}' || true

      - name: Validate JavaScript Syntax
        run: |
          for file in assets/js/*.js; do
            node --check "$file"
            echo "✅ Syntax valid: $file"
          done

      - name: Verify Critical Assets & Links
        run: |
          echo "Verifying project files and assets..."
          test -f "index.html" || { echo "❌ Missing index.html"; exit 1; }
          test -f "Shubh_Dixit_SRE_DevOps.pdf" || { echo "❌ Missing Resume PDF"; exit 1; }
          test -f "netlify.toml" || { echo "❌ Missing netlify.toml"; exit 1; }
          test -f "assets/css/style.css" || { echo "❌ Missing style.css"; exit 1; }
          test -f "assets/css/avatar.css" || { echo "❌ Missing avatar.css"; exit 1; }
          test -f "assets/css/cursor.css" || { echo "❌ Missing cursor.css"; exit 1; }
          test -f "assets/css/sre-features.css" || { echo "❌ Missing sre-features.css"; exit 1; }
          test -f "assets/js/avatar.js" || { echo "❌ Missing avatar.js"; exit 1; }
          test -f "assets/js/cursor.js" || { echo "❌ Missing cursor.js"; exit 1; }
          test -f "assets/js/contact.js" || { echo "❌ Missing contact.js"; exit 1; }
          test -f "assets/js/sre-hud.js" || { echo "❌ Missing sre-hud.js"; exit 1; }
          test -f "assets/js/chaos-sim.js" || { echo "❌ Missing chaos-sim.js"; exit 1; }
          test -f "assets/js/palette.js" || { echo "❌ Missing palette.js"; exit 1; }
          test -f "assets/js/skills-matrix.js" || { echo "❌ Missing skills-matrix.js"; exit 1; }
          test -f "assets/js/resume-modal.js" || { echo "❌ Missing resume-modal.js"; exit 1; }
          echo "✅ All critical assets verified successfully."
